name: Mirror main branch to CNB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-cnb-main
  cancel-in-progress: true

env:
  CNB_REPOSITORY: chenarmy/FILEX

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Mirror main to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB }}
        run: |
          test -n "$CNB_TOKEN" || { echo "The CNB Actions secret is required." >&2; exit 1; }
          git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPOSITORY}.git" HEAD:main

