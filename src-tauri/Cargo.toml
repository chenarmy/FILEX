[package]
name = "filex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FILEX local-first remote operations workbench"

[lib]
name = "filex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
encoding_rs = "0.8"
filex-contracts = { path = "../crates/filex-contracts" }
filex-core = { path = "../crates/filex-core" }
filex-credentials = { path = "../crates/filex-credentials" }
filex-ssh = { path = "../crates/filex-ssh" }
filex-storage = { path = "../crates/filex-storage" }
russh-sftp = "3.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.12.0"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time"] }
tokio-util = "0.7"
uuid.workspace = true
zeroize = "1"
tauri-plugin-dialog = "=2.7.3"
tempfile = "3"
