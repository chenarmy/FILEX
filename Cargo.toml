[workspace]
resolver = "2"
members = [
    "crates/filex-contracts",
    "crates/filex-core",
    "crates/filex-credentials",
    "crates/filex-ssh",
    "crates/filex-storage",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
